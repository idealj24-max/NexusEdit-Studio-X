name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      project_name:
        description: 'Nom du projet (informatif, injecté depuis le studio)'
        required: false
        default: 'NexusEdit-Studio-X'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Configurer Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: 📦 Installer Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 🔑 Restaurer le Keystore de signature Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
            echo "✅ Keystore restauré depuis le secret GitHub."
          else
            echo "⚠️ Secret ANDROID_KEYSTORE_BASE64 absent."
            echo "⚠️ Génération d'un keystore temporaire."

            keytool -genkey -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=NexusEdit, OU=Dev, O=Nexus, L=Paris, S=France, C=FR"
          fi

      - name: ⚙️ Configurer Bubblewrap & construire l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.bubblewrap

          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          STOREPASS="${KEYSTORE_PASSWORD:-android}"

          echo "n" | bubblewrap build \
            --manifest=twa-manifest.json \
            --keyPath=android.keystore \
            --keyAlias=android \
            --keyPass="$STOREPASS" \
            --keystorePass="$STOREPASS" \
            --skip-update-check

      - name: 📦 Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-APK-${{ github.event.inputs.project_name || 'NexusEdit-Studio-X' }}
          path: ./*.apk
