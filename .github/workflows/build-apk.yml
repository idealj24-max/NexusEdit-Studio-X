name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA Project
        run: |
          mkdir -p twa-project
          cd twa-project
          # Utilisation de yes "n" pour répondre automatiquement "No" à l'installation du JDK par Bubblewrap
          yes "n" | bubblewrap init --manifest="https://idealj24-max.github.io/NexusEdit-Studio-X/manifest.json" --skipDependenciesCheck || true

      - name: Build Android APK
        run: |
          cd twa-project
          bubblewrap build --skipDependenciesCheck

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusEditStudio-APK
          path: twa-project/*.apk
