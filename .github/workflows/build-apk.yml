name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Installer l'outil Bubblewrap de Google
        run: npm install -g @bubblewrap/cli

      - name: 🛠 Compiler la PWA en APK Android Natif
        run: |
          bubblewrap init --manifest=https://idealj24-max.github.io/NexusEdit-Studio-X/manifest.json
          bubblewrap build
        env:
          CI: true

      - name: 📦 Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-APK
          path: ./*.apk
