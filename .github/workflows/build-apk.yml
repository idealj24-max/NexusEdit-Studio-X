name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create TWA Project Directory & Configuration
        run: |
          mkdir -p twa-project
          cat << 'EOF' > twa-project/twa-manifest.json
          {
            "packageId": "com.nexuseditstudio.app",
            "host": "idealj24-max.github.io",
            "name": "NexusEdit Studio",
            "launcherName": "NexusEdit",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#000000",
            "startUrl": "/NexusEdit-Studio-X/",
            "iconUrl": "https://idealj24-max.github.io/NexusEdit-Studio-X/icon.png",
            "maskableIconUrl": "https://idealj24-max.github.io/NexusEdit-Studio-X/icon.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://idealj24-max.github.io/NexusEdit-Studio-X/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "display": "standalone",
            "orientation": "default",
            "fingerprints": []
          }
          EOF

      - name: Generate Android Project
        run: |
          cd twa-project
          bubblewrap build --skipDependenciesCheck

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusEditStudio-APK
          path: twa-project/*.apk
