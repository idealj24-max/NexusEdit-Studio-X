name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Configuration de Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 🚀 Génération et Compilation de l'APK TWA
        run: |
          # Affichage de la configuration pour diagnostic
          npx @bubblewrap/cli --version
          
          # Initialisation directe et construction non interactive sécurisée
          npx @bubblewrap/cli init --manifest ./twa-manifest.json --directory ./twa-output --batch || true
          
          cd twa-output
          
          # Si le fichier build.gradle n'est pas présent, on force la mise à jour
          if [ ! -f "build.gradle" ]; then
            npx @bubblewrap/cli update --manifest ./twa-manifest.json --batch || true
          fi
          
          # Compilation de l'APK debug
          chmod +x gradlew || true
          ./gradlew assembleDebug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: |
            twa-output/app/build/outputs/apk/debug/*.apk
            twa-output/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
