name: Build Android APK (NexusEdit Studio)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation du JDK 17 (Requis pour la compilation Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Génération et compilation PWA vers APK
        run: |
          mkdir -p build-android
          cd build-android
          bubblewrap init --manifest="https://idealj4-max.github.io/manifest.json"
          bubblewrap build

      - name: Sauvegarde de l'APK comme Artifact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NexusEditStudio-Release-APK
          path: build-android/*.apk
          retention-days: 30
