name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js (Version Moderne)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ☕ Configurer Java JDK 17 (Obligatoire pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Installer l'outil Bubblewrap de Google
        run: npm install -g @bubblewrap/cli

      - name: 🛠 Compiler la PWA en APK Android Natif
        run: |
          # 1. Configuration stricte de l'environnement Java et Android SDK
          mkdir -p ~/.bubblewrap
          echo '{"jdkPath":"'"$JAVA_HOME"'","androidSdkPath":"/usr/local/lib/android/sdk"}' > ~/.bubblewrap/config.json
          
          # 2. Nettoyage complet des anciens fichiers d'initialisation conflictuels s'ils existent
          rm -rf android-project
          
          # 3. Initialisation en local à partir du fichier manifest.json du dépôt
          # L'option --host spécifie explicitement votre nom de domaine de production
          yes | bubblewrap init --manifest=./manifest.json --host=https://github.io --meta --yes
          
          # 4. Génération finale de l'APK
          yes | bubblewrap build --yes

      - name: 📦 Sauvegarder l'APK généré dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-Digital-APK
          path: ./*.apk
