name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Installer Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 🔑 Générer Keystore de signature Android
        run: |
          if [ ! -f android.keystore ]; then
            keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=NexusEdit, OU=Dev, O=Nexus, L=Paris, S=France, C=FR"
          fi

      - name: ⚙️ Configurer Bubblewrap & Builder l'APK
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          # Injection automatique de la réponse "n" si Bubblewrap pose la question de régénération
          echo "n" | bubblewrap build --manifest=twa-manifest.json --keyPath=android.keystore --keyAlias=android --keyPass=android --keystorePass=android --skip-update-check

      - name: 📦 Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-APK
          path: ./*.apk
