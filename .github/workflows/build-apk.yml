name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js (Version Moderne)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ☕ Configurer Java JDK 17 (Obligatoire pour Android)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Installer l'outil Bubblewrap de Google
        run: npm install -g @bubblewrap/cli

      - name: 🛠 Charger le SDK système & Compiler l'APK
        run: |
          # 1. Configuration des chemins en utilisant les variables systèmes de GitHub ($JAVA_HOME et $ANDROID_HOME)
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          
          # 2. Création de la clé de signature automatique
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=NexusEdit, OU=Dev, O=Nexus, L=Paris, S=France, C=FR"
          
          # 3. Lancement de la compilation
          yes | bubblewrap build --yes

      - name: 📦 Sauvegarder l'APK généré dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-Digital-APK
          path: ./*.apk
