name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js (Version Moderne)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ☕ Configurer Java JDK 17 (Obligatoire pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Installer l'outil Bubblewrap de Google
        run: npm install -g @bubblewrap/cli

      - name: 🛠 Compiler la PWA en APK Android Natif
        run: |
          # On crée un fichier de configuration pour dire à Bubblewrap où se trouve Java
          # Cela évite qu'il pose des questions dans le terminal de GitHub
          mkdir -p ~/.bubblewrap
          echo '{"jdkPath":"'"$JAVA_HOME"'","androidSdkPath":"/usr/local/lib/android/sdk"}' > ~/.bubblewrap/config.json
          
          # Initialisation automatique en validant toutes les invites par défaut
          yes | bubblewrap init --manifest=https://github.io --meta --yes
          
          # Build final de l'APK
          yes | bubblewrap build --yes

      - name: 📦 Sauvegarder l'APK généré dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-Digital-APK
          path: ./*.apk
