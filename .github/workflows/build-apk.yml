name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 📱 Validation de la PWA
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js

      - name: ⚙️ Build Android Automatisé
        run: |
          # On répond "Yes" automatiquement pour que Bubblewrap gère l'installation du JDK tout seul
          echo "Y" | npx @bubblewrap/cli init --manifest=./manifest.json --directory=android-app --unattended
          
          cd android-app
          npx @bubblewrap/cli build

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: android-app/app/build/outputs/apk/release/*.apk
