name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Injection automatique des chemins dans le manifeste
        env:
          MY_JAVA_HOME: ${{ steps.setup-java.outputs.path || env.JAVA_HOME }}
          MY_ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "./twa-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            
            console.log("JAVA_HOME detecte :", process.env.MY_JAVA_HOME);
            console.log("ANDROID_SDK_ROOT detecte :", process.env.MY_ANDROID_SDK_ROOT);

            manifest.jdkPath = process.env.MY_JAVA_HOME;
            manifest.androidSdkPath = process.env.MY_ANDROID_SDK_ROOT;
            
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
          '

      - name: 🚀 Build Android Automatisé
        run: npx @bubblewrap/cli build --unattended

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: app/build/outputs/apk/release/*.apk
