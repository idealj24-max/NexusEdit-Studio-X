name: Build Android APK (NexusEdit Studio)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Génération et compilation PWA vers APK
        run: |
          mkdir -p build-android
          cd build-android
          bubblewrap init --manifest="https://idealj4-max.github.io/manifest.json" --yes
          bubblewrap build --yes

      - name: Sauvegarde de l'APK comme Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build-android/*.apk
