name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Android APK with PWABuilder
        uses: pwa-builder/pwabuilder-action@v1.0.0
        with:
          pwa-url: "https://idealj24-max.github.io/NexusEdit-Studio-X/"
          output-dir: "android-apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusEditStudio-APK
          path: android-apk/*.apk
