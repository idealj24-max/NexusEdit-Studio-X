name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
 _build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Configuration de Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Injection automatique des chemins dans le manifeste
        run: |
          node -e '
            const fs = require("fs");
            const file = "./twa-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            
            manifest.jdkPath = process.env.JAVA_HOME;
            manifest.androidSdkPath = process.env.ANDROID_SDK_ROOT;
            
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
          '
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 🚀 Build Android Automatisé (Non-interactif)
        run: |
          # Utilisation de yes pour répondre automatiquement aux éventuelles invites de configuration de Bubblewrap
          yes "" | npx @bubblewrap/cli build --unattended || npx @bubblewrap/cli update --manifest ./twa-manifest.json && npx @bubblewrap/cli build --unattended
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
