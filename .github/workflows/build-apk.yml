name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 📱 Validation de la PWA
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f twa-manifest.json

      - name: ⚙️ Build Android Automatisé
        run: |
          # On envoie "N" automatiquement pour répondre à la question interactive de Bubblewrap
          echo "N" | npx @bubblewrap/cli build --unattended || npx @bubblewrap/cli build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: app/build/outputs/apk/release/*.apk
