name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 📱 Validation et préparation de la PWA
        run: |
          echo "Vérification des fichiers essentiels..."
          test -f index.html
          test -f manifest.json
          test -f sw.js
          echo "📦 Structure PWA validée avec succès."

      - name: ⚙️ Initialisation et Build Android avec Bubblewrap
        run: |
          # Configuration non interactive pour éviter le blocage du terminal
          npx @bubblewrap/cli init --manifest=./manifest.json --directory=android-app --skip-sdk-check --unattended
          
          # Se placer dans le dossier généré et compiler l'application
          cd android-app
          npx @bubblewrap/cli build

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: android-app/app/build/outputs/apk/release/*.apk
