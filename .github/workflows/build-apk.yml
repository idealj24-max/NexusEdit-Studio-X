name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Injection automatique du JDK et du SDK dans le manifest
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            manifest.jdkPath = process.env.JAVA_HOME;
            manifest.androidSdkPath = process.env.ANDROID_SDK_ROOT;
            fs.writeFileSync("twa-manifest.json", JSON.stringify(manifest, null, 2));
          '
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📱 Validation de la PWA
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f twa-manifest.json

      - name: 🚀 Build Android Automatisé
        run: printf "n\n%s\n" "$JAVA_HOME" | npx @bubblewrap/cli build --unattended
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: app/build/outputs/apk/release/*.apk
