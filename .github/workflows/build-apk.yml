name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js (Version Moderne)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ☕ Configurer Java JDK 17 (Obligatoire pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Installer l'outil Bubblewrap et un serveur HTTP local
        run: npm install -g @bubblewrap/cli http-server

      - name: 🛠 Compiler la PWA en APK Android Natif
        run: |
          # 1. Configuration stricte de l'environnement Java et Android SDK
          mkdir -p ~/.bubblewrap
          echo '{"jdkPath":"'"$JAVA_HOME"'","androidSdkPath":"/usr/local/lib/android/sdk"}' > ~/.bubblewrap/config.json
          
          # 2. Démarrage du micro-serveur en arrière-plan pour exposer le manifest proprement
          http-server . -p 8080 &
          sleep 3 # On attend 3 secondes que le serveur s'initialise
          
          # 3. Initialisation de Bubblewrap via l'URL locale du serveur HTTP
          yes | bubblewrap init --manifest=http://localhost:8080/manifest.json --meta --yes
          
          # 4. Génération finale du package APK Android
          yes | bubblewrap build --yes

      - name: 📦 Sauvegarder l'APK généré dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-Digital-APK
          path: ./*.apk
