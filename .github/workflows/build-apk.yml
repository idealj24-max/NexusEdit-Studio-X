name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js (Version Moderne)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ☕ Configurer Java JDK 17 (Obligatoire pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Installer l'outil Bubblewrap de Google
        run: npm install -g @bubblewrap/cli

      - name: 🛠 Générer le keystore temporaire & Compiler l'APK
        run: |
          # 1. Configuration des chemins Java pour Bubblewrap
          mkdir -p ~/.bubblewrap
          echo '{"jdkPath":"'"$JAVA_HOME"'","androidSdkPath":"/usr/local/lib/android/sdk"}' > ~/.bubblewrap/config.json
          
          # 2. Création d'une clé de signature (keystore) factice pour que le build automatique de GitHub ne bloque pas
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=NexusEdit, OU=Dev, O=Nexus, L=Paris, S=France, C=FR"
          
          # 3. Lancement direct de la compilation à partir de votre twa-manifest.json
          yes | bubblewrap build --yes

      - name: 📦 Sauvegarder l'APK généré dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-Digital-APK
          path: ./*.apk
