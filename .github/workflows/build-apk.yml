name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Configuration de Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 🚀 Génération automatique de la structure Android
        run: |
          # Création de la structure de base si elle n'existe pas
          npx @bubblewrap/cli init --manifest ./twa-manifest.json --batch --skip-icon-validation || true
          
          # Si le fichier gradlew n'est toujours pas présent, on l'initialise proprement
          if [ ! -f "gradlew" ]; then
            echo "📦 Initialisation du wrapper Gradle..."
            gradle wrapper --gradle-version 8.0
          fi
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: ⚙️ Rendre Gradle exécutable et Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: app/build/outputs/apk/debug/*.apk
