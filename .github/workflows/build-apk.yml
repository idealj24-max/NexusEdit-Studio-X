name: 🚀 Build NexusEdit Studio APK (PWA TWA)

on:
  push:
    branches:
      - main # Se déclenche dès que vous mettez à jour votre branche principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🤖 Installer l'outil Bubblewrap de Google
        run: npm install -g @bubblewrap/cli

      - name: 🛠 Compiler la PWA en APK Android Natif
        run: |
          # Initialise et génère le projet Android à partir de votre twa-manifest.json
          bubblewrap init --manifest=https://github.io --meta --yes
          bubblewrap build --yes

      - name: 📦 Sauvegarder l'APK généré dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NexusEdit-Studio-Digital-APK
          path: ./*.apk
