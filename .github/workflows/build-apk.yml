name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Configuration de Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: 🛠️ Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Configurer les chemins dans twa-manifest.json
        run: |
          jq --arg java "$JAVA_HOME" --arg sdk "$ANDROID_SDK_ROOT" '.jdkPath = $java | .androidSdkPath = $sdk' twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 🚀 Initialisation et Build Android Automatisé
        run: |
          npx @bubblewrap/cli init --manifest ./twa-manifest.json --batch --skip-icon-validation
          npx @bubblewrap/cli build --skip-signing
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📦 Sauvegarde et Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-edit-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
