name: Nexus PWA to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validation du Manifeste et des fichiers PWA
        run: |
          echo "Vérification de la présence de index.html, manifest.json et sw.js..."
          ls -la
          test -f index.html
          test -f manifest.json
          test -f sw.js
          echo "Structure PWA validée avec succès pour le déploiement."
